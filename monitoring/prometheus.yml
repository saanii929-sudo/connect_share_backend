global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: connectshare_app
    static_configs:
      - targets: ['app:3000']
    metrics_path: /api/metrics
    # Uncomment to protect the metrics endpoint with a bearer token:
    # bearer_token: <YOUR_METRICS_BEARER_TOKEN>
    # scheme: http

  - job_name: connectshare_relay
    static_configs:
      - targets: ['relay:4002']
    metrics_path: /

  - job_name: node_exporter
    static_configs:
      - targets: ['app:9100']

# ── Alerting rules ────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/alerts.yml

