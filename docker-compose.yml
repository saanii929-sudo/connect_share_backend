version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ConnectShare — Main Docker Compose
# Designed for Coolify (direct build from repo) and local production testing.
# NO host-path bind mounts — all config is baked into images.
# ─────────────────────────────────────────────────────────────────────────────

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    target: runner

x-app-env: &app-env
  DATABASE_URL: postgresql://cs_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/connectshare
  REDIS_URL:    redis://redis:6379

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       connectshare
      POSTGRES_USER:     cs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d connectshare"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Database migration (runs once before app starts) ─────────────────────────
  migrate:
    <<: *app-image
    environment:
      <<: *app-env
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # ── Next.js API server ──────────────────────────────────────────────────────
  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      # Coolify reads SERVICE_FQDN_* to route Traefik to this service
      SERVICE_FQDN_APP: ${SERVICE_FQDN_APP:-}
      NODE_ENV:                 production
      JWT_ACCESS_SECRET:        ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:       ${JWT_REFRESH_SECRET}
      INVITE_HMAC_SECRET:       ${INVITE_HMAC_SECRET}
      DEVICE_TOKEN_SECRET:      ${DEVICE_TOKEN_SECRET}
      WG_KEY_ENCRYPTION_SECRET: ${WG_KEY_ENCRYPTION_SECRET}
      RELAY_SESSION_KEY_SECRET: ${RELAY_SESSION_KEY_SECRET}
      RELAY_AUTH_SECRET:        ${RELAY_AUTH_SECRET}
      METRICS_BEARER_TOKEN:     ${METRICS_BEARER_TOKEN:-}
      JWT_ACCESS_EXPIRES_IN:    ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN:   ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT:                     3000
      REALTIME_PORT:            3001
      RELAY_PORT:               3002
      APP_URL:                  ${APP_URL:-http://localhost:3000}
      RELAY_URL:                ${RELAY_URL:-ws://localhost:3002}
      WG_SERVER_LISTEN_PORT:    ${WG_SERVER_LISTEN_PORT:-51820}
      WG_BASE_SUBNET:           ${WG_BASE_SUBNET:-10.8.0.0/24}
      WG_OUTBOUND_IFACE:        ${WG_OUTBOUND_IFACE:-eth0}
      GATEWAY_HEARTBEAT_TIMEOUT_MS: ${GATEWAY_HEARTBEAT_TIMEOUT_MS:-30000}
      GATEWAY_VERIFY_ATTEMPTS:  ${GATEWAY_VERIFY_ATTEMPTS:-3}
      RATE_LIMIT_WINDOW_MS:     ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX:           ${RATE_LIMIT_MAX:-60}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis: { condition: service_healthy }
    # No Docker healthcheck — Coolify's proxy handles liveness.
    # A healthcheck here blocks relay/grafana from starting if app is slow.
    # Use GET /api/health manually to verify after deploy.

  # ── Realtime WebSocket hub ──────────────────────────────────────────────────
  realtime:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      NODE_ENV:              production
      JWT_ACCESS_SECRET:     ${JWT_ACCESS_SECRET}
      REALTIME_PORT:         3001
      APP_URL:               ${APP_URL:-http://localhost:3000}
    command: ["node", "node_modules/tsx/dist/cli.mjs", "realtime/server.ts"]
    ports:
      - "3001:3001"
    depends_on:
      redis: { condition: service_healthy }

  # ── Relay / Networking Engine ────────────────────────────────────────────────
  relay:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      NODE_ENV:          production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET}
      RELAY_PORT:        3002
      APP_URL:           http://app:3000
      GATEWAY_VERIFY_ATTEMPTS: ${GATEWAY_VERIFY_ATTEMPTS:-3}
    command: ["node", "node_modules/tsx/dist/cli.mjs", "relay/server.ts"]
    ports:
      - "3002:3002"
    depends_on:
      app:   { condition: service_started }
      redis: { condition: service_healthy }

  # ── Prometheus (config baked into custom image — no host mounts) ────────────
  prometheus:
    build:
      context: docker/prometheus
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    depends_on:
      - app

  # ── Grafana (provisioning baked into custom image — no host mounts) ─────────
  grafana:
    build:
      context: docker/grafana
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
