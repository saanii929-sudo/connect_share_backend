version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ConnectShare — Main Docker Compose
# Works for: local production testing, Coolify (direct build from repo).
# For CI/CD with pre-built images, use docker-compose.coolify.yml instead.
# ─────────────────────────────────────────────────────────────────────────────

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    target: runner

x-app-env: &app-env
  DATABASE_URL: postgresql://cs_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/connectshare
  REDIS_URL:    redis://redis:6379

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       connectshare
      POSTGRES_USER:     cs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_user -d connectshare"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Database migration (one-shot, runs before app) ─────────────────────────
  migrate:
    <<: *app-image
    environment:
      <<: *app-env
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # ── Next.js API server ──────────────────────────────────────────────────────
  app:
    <<: *app-image
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Realtime WebSocket hub ──────────────────────────────────────────────────
  realtime:
    <<: *app-image
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      NODE_ENV: production
    command: ["node", "node_modules/tsx/dist/cli.mjs", "realtime/server.ts"]
    ports:
      - "3001:3001"
    depends_on:
      redis:    { condition: service_healthy }

  # ── Relay / Networking Engine ────────────────────────────────────────────────
  relay:
    <<: *app-image
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      NODE_ENV: production
      APP_URL:  http://app:3000
    command: ["node", "node_modules/tsx/dist/cli.mjs", "relay/server.ts"]
    ports:
      - "3002:3002"
    depends_on:
      app:      { condition: service_healthy }
      redis:    { condition: service_healthy }

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
