# ConnectShare Redis configuration
# Place at /etc/redis/redis.conf (or mount into the Redis container)

# ── Persistence ───────────────────────────────────────────────────────────────
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60  10000

# ── Memory management ──────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Security ──────────────────────────────────────────────────────────────────
# Set a requirepass in production:
# requirepass <your-strong-password>

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG   ""

# ── Networking ────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes
port 6379
timeout 300
tcp-keepalive 60

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Performance ───────────────────────────────────────────────────────────────
io-threads 4
hz 10
