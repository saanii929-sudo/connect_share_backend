global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: connectshare_app
    static_configs:
      - targets: ['app:3000']
    metrics_path: /api/metrics

  - job_name: connectshare_relay
    static_configs:
      - targets: ['relay:4002']
    metrics_path: /
