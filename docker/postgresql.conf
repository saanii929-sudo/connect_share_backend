# ConnectShare PostgreSQL tuning
# Mount into the postgres container at /etc/postgresql/postgresql.conf
# or pass via POSTGRES_INITDB_ARGS / config file mount.

# ── Memory ────────────────────────────────────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# ── Connections ───────────────────────────────────────────────────────────────
max_connections = 100
# For Prisma connection pooling — keep below max_connections:
# Prisma default pool = num_cpus * 2 + 1

# ── WAL / Replication ──────────────────────────────────────────────────────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1       # SSD-tuned
effective_io_concurrency = 200

# ── Parallelism ───────────────────────────────────────────────────────────────
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# ── Logging (for observability) ───────────────────────────────────────────────
log_min_duration_statement = 500   # log queries slower than 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ── Autovacuum ────────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ── SSL (enable in production) ────────────────────────────────────────────────
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/postgresql.crt'
# ssl_key_file  = '/etc/ssl/private/postgresql.key'
